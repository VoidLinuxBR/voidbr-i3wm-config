[bar/main]
width = 100%
height = 28
background = #2E3440
foreground = #D8DEE9
font-0 = JetBrains Mono:size=10;2

modules-left = workspaces
modules-center = date
modules-right = pulseaudio network battery

[module/workspaces]
type = internal/i3
format = <label-state>
label-focused = %name%
label-focused-background = #88C0D0
label-unfocused = %name%

[module/date]
type = internal/date
interval = 60
date = %d/%m/%Y %H:%M

[module/pulseaudio]
type = internal/pulseaudio
format-volume =   %percentage%%

[module/network]
type = internal/network
interface = wlan0
format-connected =   %essid%

[module/battery]
type = internal/battery
battery = BAT0
format-charging =  %percentage%%
format-discharging =   %percentage%%
